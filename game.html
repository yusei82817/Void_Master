<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <title>Void Master | RPG</title>
  <!-- 開発初期の単一ファイル版。機能が増えたら css/game.css と js/game.js に分離する。 -->
  <link rel="stylesheet" href="game_style.css">
</head>
<body>
  <div class="shell">
    <header>
      <h1 class="brand">VOID MASTER<span>ROLE-PLAYING GAME</span></h1>
      <div class="chapter">MAIN GAME<br><span style="color:var(--muted)">開発中プロトタイプ</span></div>
    </header>

    <main class="layout">
      <section class="panel" aria-label="ゲーム画面">
        <div class="panel-title">FIELD / 現在地</div>
        <div class="scene" role="img" aria-label="青白い光が浮かぶ、暗い空間">
          <div class="sigil" aria-hidden="true">◇</div>
          <div class="scene-caption" id="location">未踏の領域</div>
        </div>
        <div class="panel-title">MESSAGE / メッセージ</div>
        <div class="message" aria-live="polite" aria-atomic="true">
          <span class="message-name" id="messageName">SYSTEM</span>
          <span id="messageText">『Void Master』本編の開発拠点。ここから世界を組み立てていく。</span>
        </div>
      </section>

      <aside class="side">
        <section class="panel" aria-label="プレイヤー情報">
          <div class="panel-title">STATUS / 状態</div>
          <div class="status-grid">
            <div class="stat"><span class="stat-label">NAME</span><span class="stat-value">未設定</span></div>
            <div class="stat"><span class="stat-label">LEVEL</span><span class="stat-value">--</span></div>
            <div class="stat"><span class="stat-label">HP</span><span class="stat-value">-- / --</span></div>
            <div class="stat"><span class="stat-label">MP</span><span class="stat-value">-- / --</span></div>
          </div>
        </section>

        <nav class="panel" aria-label="メインコマンド">
          <div class="panel-title">COMMAND / コマンド</div>
          <div class="commands">
            <button class="command" type="button" data-command="explore"><span>探索</span><small>EXPLORE ›</small></button>
            <button class="command" type="button" data-command="status"><span>ステータス</span><small>STATUS ›</small></button>
            <button class="command" type="button" data-command="items"><span>持ち物</span><small>ITEMS ›</small></button>
            <button class="command" type="button" data-command="save"><span>セーブ</span><small>SAVE ›</small></button>
            <button class="command" type="button" data-command="settings"><span>設定</span><small>OPTIONS ›</small></button>
          </div>
        </nav>
      </aside>
    </main>

    <footer>
      <span>VOID MASTER · GAME SHELL</span>
      <span class="notice" id="systemStatus">ゲームシステム未実装 · 画面プロトタイプ</span>
    </footer>
  </div>

  <script src="game_script.js" defer></script>
</body>
</html>
