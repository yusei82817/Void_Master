<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Void Master - Loading</title>
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: sans-serif;
    }

    .loading-panel {
      box-sizing: border-box;
      width: min(82vw, 520px);
      min-height: 112px;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-radius: 14px;
      text-align: center;
    }

    #loading-message {
      margin: 0;
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 600;
      opacity: 1;
      transition: opacity 250ms ease;
    }

    #loading-message.is-changing {
      opacity: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-message {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="loading-panel" aria-live="polite" aria-atomic="true">
    <h2 id="loading-message">私は……何も知らない。</h2>
  </main>

  <script>
    const messages = [
      "私は……何も知らない。",
      "自分がどこから来たのか、なぜここにいるのか ——",
      "名前以外は、何も。",
      "目が覚めた時、周りは黒に包まれていた。",
      "大地は濁り、空は澱み、音さえも吸い込まれていく場所。",
      "それが「クローロ」だと、後になって知った。",
      "なのに私は ——",
      "その闇の中に立っても、少しも痛くなかった。",
      "傷もつかなければ、苦しくもない。",
      "周りのものが次々と呑まれていく中で、私だけが、ただ佇んでいた。",
      "「なぜ君は平気なの？」",
      "誰かがそう言った。",
      "「なぜ闇に消されないの？」",
      "その問いに、私は答えられない。",
      "…… 私自身が、何なのか分からないから。",
      "教えてほしい。",
      "私は誰なの？",
      "何のために在るの？",
      "この白い髪も、蒼い瞳も ——",
      "そして、胸の奥で疼くこの光は、いったい何なの？",
      "「核の欠片」だなんて、そんな言葉で括られるのは苦しい。",
      "道具じゃない。",
      "生贄にされるためだけに生まれてきたんじゃない。",
      "ただ……",
      "誰かの手を、握りたいだけなのに。",
      "共に歩いて、同じものを見て、笑い合いたいだけなのに。",
      "クローロは何もかもを飲み込もうとしている。",
      "でも ——",
      "闇が濃くなるほど、光は際立つ。",
      "私の中のこの光は、きっと消えない。",
      "あなたはそこにいてくれますか？",
      "私の手を取ってくれますか？",
      "闇が怖いと、同じように思ってくれますか？",
      "—— クレイン。",
      "初めて名前を呼んだ人。",
      "あなたがそばにいてくれるのなら、私は闇の中でも歩いていける。",
      "二人なら、きっと ——",
      "この世界の空白を、埋めることができる。",
      "私は消えたりしない。",
      "あなたと共に、生きるから。"
    ];

    const messageElement = document.getElementById("loading-message");
    let messageIndex = 0;

    window.setInterval(() => {
      messageElement.classList.add("is-changing");

      window.setTimeout(() => {
        messageIndex = (messageIndex + 1) % messages.length;
        messageElement.textContent = messages[messageIndex];
        messageElement.classList.remove("is-changing");
      }, 250);
    }, 3000);
  </script>
</body>
</html>
