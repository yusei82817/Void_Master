<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>Crane - 32x32 pixel sprite</title>
  <desc>Pixel-art sprite of Crane, a silver-haired swordsman in worn dark protective clothing, with pale amber eyes and a straight sword.</desc>
  <!-- sword -->
  <rect x="25" y="3" width="2" height="17" fill="#AEB8C4"/>
  <rect x="25" y="3" width="1" height="14" fill="#E0E6EA"/>
  <rect x="24" y="18" width="4" height="2" fill="#8A633D"/>
  <rect x="25" y="20" width="2" height="3" fill="#6D4A30"/>
  <!-- hair silhouette -->
  <rect x="10" y="3" width="10" height="2" fill="#626B79"/>
  <rect x="8" y="5" width="14" height="5" fill="#AAB2BE"/>
  <rect x="9" y="4" width="11" height="4" fill="#D5D9DF"/>
  <rect x="7" y="7" width="3" height="5" fill="#8B95A3"/>
  <rect x="20" y="7" width="3" height="6" fill="#7B8594"/>
  <rect x="9" y="9" width="2" height="4" fill="#C2C9D2"/>
  <!-- face -->
  <rect x="11" y="8" width="9" height="8" fill="#E3C9AA"/>
  <rect x="10" y="9" width="2" height="5" fill="#D0B18F"/>
  <rect x="19" y="10" width="2" height="4" fill="#C5A17E"/>
  <!-- fringe -->
  <rect x="10" y="7" width="3" height="3" fill="#D5D9DF"/>
  <rect x="13" y="7" width="3" height="2" fill="#B9C1CC"/>
  <rect x="16" y="8" width="3" height="2" fill="#D5D9DF"/>
  <rect x="12" y="10" width="2" height="1" fill="#626B79"/>
  <rect x="17" y="10" width="2" height="1" fill="#626B79"/>
  <!-- amber eyes -->
  <rect x="13" y="11" width="2" height="1" fill="#D5A548"/>
  <rect x="17" y="11" width="2" height="1" fill="#D5A548"/>
  <rect x="15" y="13" width="2" height="1" fill="#9B7256"/>
  <!-- neck -->
  <rect x="14" y="16" width="4" height="2" fill="#C5A17E"/>
  <!-- worn protective suit -->
  <rect x="10" y="18" width="11" height="7" fill="#39414D"/>
  <rect x="12" y="18" width="6" height="2" fill="#596473"/>
  <rect x="9" y="20" width="3" height="5" fill="#4A5360"/>
  <rect x="19" y="20" width="3" height="5" fill="#252C36"/>
  <rect x="13" y="21" width="2" height="2" fill="#77818D"/>
  <rect x="16" y="22" width="2" height="1" fill="#9A7954"/>
  <!-- arms and gloves -->
  <rect x="7" y="19" width="3" height="6" fill="#505A67"/>
  <rect x="21" y="19" width="3" height="5" fill="#39414D"/>
  <rect x="7" y="24" width="3" height="2" fill="#BDA083"/>
  <rect x="21" y="23" width="3" height="2" fill="#BDA083"/>
  <!-- trousers and boots -->
  <rect x="11" y="25" width="4" height="4" fill="#303743"/>
  <rect x="16" y="25" width="4" height="4" fill="#252C36"/>
  <rect x="10" y="29" width="5" height="2" fill="#171C24"/>
  <rect x="16" y="29" width="5" height="2" fill="#171C24"/>
  <!-- repair patches -->
  <rect x="11" y="22" width="2" height="2" fill="#8A633D"/>
  <rect x="18" y="25" width="2" height="1" fill="#8A633D"/>
  <!-- left-hand mark -->
  <rect x="8" y="24" width="1" height="1" fill="#8ED7E8"/>
