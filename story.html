<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07180f">
  <title>Void Master | Story</title>
  <style>
    :root { color-scheme: dark; --bg:#07180f; --panel:#10271b; --line:#31543b; --text:#edf4e8; --muted:#b4c8b4; --accent:#a8d98b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; color:var(--text); background:radial-gradient(ellipse at 50% 0%,#234b2c 0%,#0d2415 45%,var(--bg) 100%); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(860px,100%); }
    .eyebrow { color:var(--accent); font-size:.78rem; letter-spacing:.16em; }
    h1 { margin:.45rem 0 1.2rem; font-size:clamp(1.45rem,4vw,2.2rem); }
    .scene { border:0; background:transparent; border-radius:0; padding:0; min-height:300px; box-shadow:none; }
    .scene-layout { display:flex; align-items:stretch; gap:clamp(12px,3vw,28px); min-height:300px; }
    .portrait { display:block; width:clamp(120px,27vw,240px); max-height:460px; object-fit:contain; object-position:center bottom; align-self:flex-end; flex:0 0 auto; filter:drop-shadow(0 12px 18px #0007); }
    .portrait[hidden] { display:none; }
    .dialogue { flex:1; min-width:0; align-self:center; border:1px solid var(--line); background:linear-gradient(145deg,rgba(18,47,29,.97),rgba(7,20,13,.99)); border-radius:16px; padding:clamp(18px,3.5vw,32px); min-height:220px; box-shadow:0 20px 70px #0005; }
    .scene-layout.crane-speaker { flex-direction:row; }
    .scene-layout.other-speaker { flex-direction:row; }
    .scene-layout.narration { justify-content:center; }
    .scene-layout.narration .dialogue { width:100%; }
    .chapter { color:var(--accent); font-size:.9rem; margin-bottom:1.2rem; }
    #speaker { color:var(--accent); font-weight:700; margin-bottom:.8rem; min-height:1.4em; }
    #text { font-size:clamp(1rem,2.4vw,1.12rem); line-height:2; white-space:pre-wrap; }
    @media (max-width:560px) {
      body { padding:12px; }
      .scene-layout { gap:8px; min-height:250px; }
      .portrait { width:clamp(76px,25vw,125px); max-height:330px; }
      .dialogue { padding:15px; min-height:200px; }
      #text { line-height:1.8; }
    }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:18px; color:var(--muted); font-size:.88rem; }
    button { border:1px solid #6b965b; border-radius:9px; background:#244b2b; color:#fff; padding:12px 22px; font:inherit; font-weight:650; cursor:pointer; }
    button:hover { background:#32643a; } button:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    #progress { font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">VOID MASTER · STORY EVENT</div>
    <h1 id="title">深緑の森の邂逅</h1>
    <section class="scene" aria-live="polite" aria-atomic="true">
      <div class="scene-layout narration" id="sceneLayout">
        <img class="portrait" id="portrait" alt="" hidden>
        <div class="dialogue">
          <div class="chapter" id="chapter">1. 森の入口</div>
          <div id="speaker"></div>
          <div id="text"></div>
        </div>
      </div>
    </section>
    <div class="controls">
      <span id="progress">1 / 1</span>
      <button id="next" type="button">次へ ▶</button>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const eventId = params.get('event') || 'S1';

    // Story pages are separate documents, so restart the current area's looped BGM here.
    // The game stores its exploration state in sessionStorage before navigating to this page.
    let storyAreaId = ({ S1: 'forest', S2: 'cave', S3: 'volcano' })[eventId] || 'village';
    try {
      const rawHandoff = sessionStorage.getItem('voidMasterStoryHandoff');
      if (rawHandoff) {
        const handoff = JSON.parse(rawHandoff);
        if (handoff?.state?.areaId) storyAreaId = handoff.state.areaId;
      }
    } catch (error) {
      console.error('Story BGM handoff read failed:', error);
    }
    import('./js/bgm.js')
      .then(({ setBackgroundMusic }) => setBackgroundMusic(storyAreaId, document))
      .catch((error) => console.error('Story BGM failed to initialize:', error));
    const events = {
      S1: {
        title: '深緑の森の邂逅',
        lines: [
          { chapter:'1. 森の入口', speaker:'', text:'クレインは外壁警備の巡回中、予兆なく姿を消した調査隊の痕跡を追って森へ踏み込む。\n\n木々の緑が濃く重なり、上空の雲さえも遮られる。\nこの森は、エデンを囲む外壁の外側に残された、わずかな「まだ腐っていない」土地だ。\nだがそれも時間の問題だと、誰もが知っている。' },
          { chapter:'1. 森の入口', speaker:'クレイン', text:'（木々の間を歩きながら）\n……ここまで調査隊の痕跡がないのか。' },
          { chapter:'1. 森の入口', speaker:'', text:'森の奥へ踏み込むほど、空気が澄んでいく。\nクローロの瘴気は本来、もっと重く、肌に刺すようなはずなのに。\n手の甲の紋様が、微かに疼く。\nクレインはそれを押さえ込むように手を握り、歩を進める。' },
          { chapter:'2. 泉のほとり', speaker:'', text:'視界が開け、小さな泉が姿を現す。\n周囲の木々は一際鮮やかな緑に輝き、泉の水面は青い光をたたえている。\nその中央に、一人の少女が倒れていた。' },
          { chapter:'2. 泉のほとり', speaker:'クレイン', text:'（剣を抜く手を止め）\n……誰だ。\nこんな場所に、一人で。' },
          { chapter:'2. 泉のほとり', speaker:'', text:'警戒しながら近づく。\n白い髪が木漏れ日にさらされ、衣は薄く、瘴気で傷むはずの肌には一点の曇りもない。\nまるで世界の腐敗が彼女には届いていないかのようだ。' },
          { chapter:'2. 泉のほとり', speaker:'リーナ', text:'（うっすらと目を開け）\n……ここは。\n私は……' },
          { chapter:'2. 泉のほとり', speaker:'クレイン', text:'大丈夫か？ 君、どうしてこんな所にいるんだ。\nこの先はクローロの侵食域が迫っている。普通なら、長くはいられないはずだ。' },
          { chapter:'2. 泉のほとり', speaker:'リーナ', text:'（ゆっくりと体を起こし、周囲を見渡し）\n黒く……ない。\n闇に、飲まれていない。\n……きれい。' },
          { chapter:'2. 泉のほとり', speaker:'クレイン', text:'（眉をひそめ）\n君、瘴気に当たっていないのか？\n外の大地は既に黒く濁り、生き物の姿さえ消えている。\nこの森が例外なだけだ。' },
          { chapter:'2. 泉のほとり', speaker:'リーナ', text:'手を伸ばしても、痛くない。\n吸い込まれない。\n私……何も分からないの。\n目が覚めたら、闇の中にいて。\nそれで歩いていたら——この光に、導かれるように。' },
          { chapter:'2. 泉のほとり', speaker:'', text:'彼女の瞳は深海のような蒼色で、真っ直ぐにクレインを見つめる。\nその視線には疑いも恐れもなく、ただ純粋な問いかけが宿っている。' },
          { chapter:'2. 泉のほとり', speaker:'クレイン', text:'（手の甲の紋様が、彼女の方を向いて微かに輝く）\n……俺の紋が反応している。\n初めてだ。これほど強く。' },
          { chapter:'2. 泉のほとり', speaker:'リーナ', text:'その紋様……\n暖かい。\n守ってくれるような……気がする。' },
          { chapter:'2. 泉のほとり', speaker:'クレイン', text:'俺はクレイン。エデンの警備員だ。\n君の名前は？' },
          { chapter:'2. 泉のほとり', speaker:'リーナ', text:'……リーナ。\nそれだけは覚えている。\nそれ以外は、何も。' },
          { chapter:'2. 泉のほとり', speaker:'クレイン', text:'リーナか。\n——このまま森にいるのは危険だ。\n侵食は確実に迫っている。エデンまで一緒に来なさい。\n詳しい話は、そこで聞けばいい。' },
          { chapter:'2. 泉のほとり', speaker:'リーナ', text:'うん。\nクレイン……さん。\nあなたと一緒なら、怖くない。' },
          { chapter:'2. 泉のほとり', speaker:'', text:'少女はゆっくりと立ち上がり、クレインの差し出した手を取る。\nその瞬間、手の甲の紋様が蒼い光と重なり、一瞬だけ森全体が明るく輝いた。\n木々の葉がそよぎ、泉の水面が穏やかに波打つ。\n二人の出会いが、静かに終わりゆく世界の運命を動かし始めた。' },
          { chapter:'3. 幕間', speaker:'', text:'クレインがリーナを伴い森を後にする。\n背後では、木々の緑が少しだけ濃くなったように見えた。\nだがそれも束の間、遠くの空にはクローロの黒い靄が、確実に広がり始めているのだった。\n\n—— S1 了 ——' }
        ]
      },
      S2: {
        title: '忘却の洞窟',
        lines: [
          { chapter:'1. 洞窟入口', speaker:'', text:'深緑の森の奥深く、木々の根が岩肌を這う場所に洞窟の口が開いていた。木漏れ日は届かず、内部は濃い闇に包まれている。風の音も消え、水滴の音だけが低く響く。' },
          { chapter:'1. 洞窟入口', speaker:'クレイン', text:'（剣の柄を握り、入口の闇を見つめる）\n……ここが、忘却の洞窟か。森の住民たちが決して近づかない場所だ。「入った者は帰ってこない」とまで言われている。' },
          { chapter:'1. 洞窟入口', speaker:'リーナ', text:'（少し後ろから恐る恐る覗き込む）\n暗いですね……でも、嫌な感じはしないです。どこか……落ち着くような。' },
          { chapter:'1. 洞窟入口', speaker:'クレイン', text:'そうか。君がそう言うなら、行ってみよう。ただ、絶対に離れるな。何が起こるか分からない。' },
          { chapter:'1. 洞窟入口', speaker:'リーナ', text:'はい。手、つないでもいいですか？' },
          { chapter:'1. 洞窟入口', speaker:'クレイン', text:'（少し戸惑いつつ手を差し伸べる）\nああ。離さないように。' },
          { chapter:'1. 洞窟入口', speaker:'', text:'手を取り合い、二人は洞窟の闇へ一歩踏み込む。直後、リーナの体から微かな蒼い光が広がり、足元と岩肌を柔らかく照らし出した。' },
          { chapter:'2. 記憶の痕跡', speaker:'', text:'奥へ進むにつれ、道は緩やかな下り坂になる。壁面には人の手で刻まれたらしい模様が残っているが、風化して一部しか読み取れない。クローロの侵食が及んでいない空間には、時間が止まったような静けさが満ちていた。' },
          { chapter:'2. 記憶の痕跡', speaker:'クレイン', text:'（壁の模様に触れる）\n古い……エデンが築かれるより、ずっと前の時代のものだと聞いたことがある。人々は何のために、こんな場所へ道を伸ばしたんだろう。' },
          { chapter:'2. 記憶の痕跡', speaker:'リーナ', text:'誰かが……探しに来たのかな。「忘れたくないもの」を守っていたのかもしれません。この洞窟の名前も、そういう意味なのかなって。' },
          { chapter:'2. 記憶の痕跡', speaker:'クレイン', text:'君には、そう見えるのか。' },
          { chapter:'2. 記憶の痕跡', speaker:'リーナ', text:'消えてほしくないもの、無くしちゃいけないものを、ここに隠して守っていた……そんな気がする。でも、それが何なのかは分からないの。' },
          { chapter:'2. 記憶の痕跡', speaker:'', text:'リーナの蒼い光が少し強まり、先の通路を照らす。二人はその光に導かれるように、さらに奥へ進んだ。' },
          { chapter:'3. 核の欠片', speaker:'', text:'最奥の小さな空間に、透明な結晶の柱が静かに立っていた。中には蒼く輝く欠片が浮かび、リーナの光と同じ色で脈打つように輝いている。周囲の空気は澄み、クローロの気配は完全に遮断されていた。' },
          { chapter:'3. 核の欠片', speaker:'クレイン', text:'（結晶柱に近づき、息を呑む）\nこれが……核の欠片？ ガルドが言っていたものに似ている。' },
          { chapter:'3. 核の欠片', speaker:'リーナ', text:'（一歩前へ出て欠片を見上げる）\n私……これを知っています。私の一部みたいな……そんな気がする。会いたかった、と思ってる。' },
          { chapter:'3. 核の欠片', speaker:'', text:'リーナが結晶に手をかざすと、欠片は輝きを増し、結晶がゆっくりと砕けていく。欠片は彼女の手のひらへ吸い込まれるように移り、胸元へと収まった。瞬間、蒼い瞳が強く輝き、洞窟全体が柔らかな光に包まれる。' },
          { chapter:'3. 核の欠片', speaker:'リーナ', text:'（胸元に手を当てる）\n……わかりました。この先に道があるって。暖かい、赤い光が見えるんです。' },
          { chapter:'3. 核の欠片', speaker:'クレイン', text:'（壁の一部が開いていることに気づく）\nあれは……溶岩洞。ガルドの話では、この洞窟の奥が火山へ続いているということだった。' },
          { chapter:'4. 溶岩洞への道', speaker:'', text:'新たに開かれた通路から、乾いて少し熱を帯びた空気が流れてくる。遠くでは地鳴りのような音が響き、暗闇の向こうに淡い橙色の光が揺らめいていた。' },
          { chapter:'4. 溶岩洞への道', speaker:'クレイン', text:'火山へ続く道……エデンに戻る道とは逆だ。だが、ここに来た以上、引き返すだけじゃ答えは見つからない。' },
          { chapter:'4. 溶岩洞への道', speaker:'リーナ', text:'（クレインの袖をそっと掴む）\n怖いけど……行ってみたいです。この先に、私たちの進むべき道がある気がします。クレインさんと一緒なら、大丈夫です。' },
          { chapter:'4. 溶岩洞への道', speaker:'クレイン', text:'（リーナの手を取り、強く握る）\nああ。俺が守る。絶対に。行こう。' },
          { chapter:'4. 溶岩洞への道', speaker:'', text:'二人は蒼い光を先頭に、未知の火山地帯へ続く道を見つめる。洞窟の静けさを背後に残し、新たな冒険の足音が響き始めた。\n\n—— S2 了 ——' }
        ]
      },
      S3: {
        title: '灰燼の火山、盗賊団ロキの待つ場所',
        lines: [
          { chapter:'1. 灰燼の山道', speaker:'', text:'忘却の洞窟を抜けた先には、灰と黒い岩に覆われた火山地帯が広がっていた。空には赤黒い雲が渦巻き、地の底から伝わる熱が靴底をじりじりと焼く。' },
          { chapter:'1. 灰燼の山道', speaker:'クレイン', text:'ここが灰燼の火山か……。洞窟で見つけた核の欠片が、こっちへ進めと導いた。ガルドもそう言っていた。' },
          { chapter:'1. 灰燼の山道', speaker:'リーナ', text:'空気が熱い……でも、欠片が胸の中で光っています。この先に、何かがあるんですね。' },
          { chapter:'1. 灰燼の山道', speaker:'クレイン', text:'ああ。だが、火山に入ってから妙に足跡が多い。魔物だけじゃない。誰かがここを通っている。' },
          { chapter:'2. 立ちふさがる影', speaker:'', text:'岩陰から複数の人影が現れ、二人の進路を塞いだ。身なりは統一されていないが、互いに合図を交わす動きには慣れがある。盗賊団ロキだ。' },
          { chapter:'2. 立ちふさがる影', speaker:'ロードマン', text:'お客さんか。こんな場所まで来るとは、物好きな連中だな。ここから先は俺たちの縄張りだ。引き返しな。' },
          { chapter:'2. 立ちふさがる影', speaker:'クレイン', text:'盗賊団ロキ……。ここで何をしている？' },
          { chapter:'2. 立ちふさがる影', speaker:'ローザ', text:'質問する立場だと思ってるの？　この火山には、あんたたちが知らない価値がある。それを手に入れるのは、早い者勝ちさ。' },
          { chapter:'2. 立ちふさがる影', speaker:'リーナ', text:'そのために、ここにいる人たちを傷つけるんですか？' },
          { chapter:'2. 立ちふさがる影', speaker:'ローラ', text:'きれいごとで腹は満たせないよ、お嬢ちゃん。生き残りたきゃ、取れるものを取る。それだけさ。' },
          { chapter:'3. 火山に潜む目的', speaker:'クレイン', text:'この先にあるものが何であれ、好き勝手に奪わせるわけにはいかない。道を開けろ。' },
          { chapter:'3. 火山に潜む目的', speaker:'ギル・マッシュ', text:'へえ、威勢がいいじゃねえか。だが、ここまで来たってことは、帰り道も楽じゃないってことだぜ。' },
          { chapter:'3. 火山に潜む目的', speaker:'', text:'ロキの一団は武器を構えた。クレインも剣に手をかけ、リーナをかばうように半歩前へ出る。火山の地鳴りが、互いの沈黙を押し流した。' },
          { chapter:'3. 火山に潜む目的', speaker:'リーナ', text:'クレインさん……気をつけて。欠片の光が、強くなっています。' },
          { chapter:'3. 火山に潜む目的', speaker:'クレイン', text:'分かっている。ここで何が待っていようと、確かめるまでは退けない。行くぞ！' },
          { chapter:'4. 対峙', speaker:'', text:'二人と盗賊団ロキの間に、火花のような灰が舞い上がる。火山の奥からは、赤い光とともに何かが脈打つ気配が響いていた。ロキを退け、その正体を突き止めなければならない。\n\n—— S3 了 ——' }
        ]
      }
      },
      S4: {
        title: '残り3タイル——ゴーストルールの影',
        lines: [
          { chapter:'1. 潮風の道', speaker:'', text:'灰燼の火山を後にし、道は海へと続いている。遠く波の音が低く響き、潮風が髪をなびかせた。地図上では、船着き場まであと3タイル。' },
          { chapter:'1. 潮風の道', speaker:'クレイン', text:'海だ……。クローロの侵食は届いていないようだ。' },
          { chapter:'1. 潮風の道', speaker:'リーナ', text:'広いですね……。でも、なんだか胸がざわざわします。この先に、何かが待っているような……。' },
          { chapter:'1. 潮風の道', speaker:'クレイン', text:'心配だな。だが、大丈夫だ。俺が守るから——' },
          { chapter:'1. 潮風の道', speaker:'', text:'言葉が途切れる。道の脇から、突然少女が飛び出してきた。銀髪をポニーテールに束ね、赤い瞳で二人を睨む。右腕の手は、5本の虹色の触手になっていた。' },
          { chapter:'2. 現れた少女', speaker:'リオーネ', text:'ちょっと、そこで止まりなさい。その先へ行ったら死ぬわ。監視されてるの、分かってないの？' },
          { chapter:'2. 現れた少女', speaker:'クレイン', text:'誰だ。なぜ道を塞ぐ？' },
          { chapter:'2. 現れた少女', speaker:'リオーネ', text:'誰だっていいでしょ。……私はリオーネ。これで分かるでしょ。クリオネのコメルパよ。' },
          { chapter:'2. 現れた少女', speaker:'リーナ', text:'きれい……。海の光みたいです。' },
          { chapter:'2. 現れた少女', speaker:'リオーネ', text:'き、きれいだなんて言うな！ 変なのよ、これ。……それより話を聞け。この先にはゴーストルールが待ってる。' },
          { chapter:'3. ゴーストルールの真実', speaker:'', text:'リオーネは口調をきつくして続ける。怒りの奥には、隠しきれない苦しみが滲んでいた。' },
          { chapter:'3. ゴーストルールの真実', speaker:'リオーネ', text:'海賊団よ。父が率いてる。連中は「核の欠片を手に入れた者が生命の頂点に立つ」って、バカみたいに信じ込んでる。だから……リーナ、あんたを攫う計画が立ってる。' },
          { chapter:'3. ゴーストルールの真実', speaker:'リーナ', text:'私が……攫われる……。' },
          { chapter:'3. ゴーストルールの真実', speaker:'リオーネ', text:'生け捕りにして、船の一番奥に閉じ込めて、力だけ搾り取るつもり。……ああ見えて父、本気なの。「娘より価値がある」なんて、私に平気で言うような人だから。' },
          { chapter:'3. ゴーストルールの真実', speaker:'クレイン', text:'……あなたの父親なのか。' },
          { chapter:'3. ゴーストルールの真実', speaker:'リオーネ', text:'関係ない！ あんなの、父親じゃない！ 核の欠片のことしか頭になくて、私のことなんて一度もちゃんと見てくれなかった！ 褒めてもくれない、抱きしめてもくれない。「役に立て」と言われ続けて……結局、私は何なのよ。道具なの？ 娘なの？ 分からないまま大きくなっただけじゃない。' },
          { chapter:'3. ゴーストルールの真実', speaker:'', text:'言い終えると、リオーネははっと口を閉じ、恥じるように顔をそむけた。' },
          { chapter:'3. ゴーストルールの真実', speaker:'リオーネ', text:'……べ、別に同情してほしいわけじゃないんだからね！ ただ、事実を教えただけ！ 引き返すなら今よ。進むなら、覚悟しなさい。' },
          { chapter:'4. 素直になれない心', speaker:'クレイン', text:'引き返さない。リーナを守る。そして、核の欠片の真実を確かめる。……それに、あなたの父親が間違っていることも、証明する。' },
          { chapter:'4. 素直になれない心', speaker:'リオーネ', text:'……バカね。死にたがりなの？ 分かったわ。なら——私もついて行く。' },
          { chapter:'4. 素直になれない心', speaker:'リーナ', text:'えっ……。' },
          { chapter:'4. 素直になれない心', speaker:'リオーネ', text:'別にあんたたちが心配だからじゃないからね！ 父のやり方が許せないだけ！ 自分の手で止めなきゃ気が済まないだけだから！ ……誰かが正しいって言ってくれる人がそばにいてくれるなら……それも、悪くないかなって、ちょっとだけ思っただけ。' },
          { chapter:'4. 素直になれない心', speaker:'クレイン', text:'一緒に行こう。力を貸してくれると助かる。' },
          { chapter:'4. 素直になれない心', speaker:'リオーネ', text:'う、うるさいわ！ 調子に乗らないで！ ……で、でも……よろしく。それだけだから！' },
          { chapter:'4. 素直になれない心', speaker:'', text:'リオーネは慌てたように先を歩き出す。その右手の触手が、恥ずかしそうに揺れ、ほんのり優しく輝いた。三人は並んで海へ続く道を進む。あと2タイル——船着き場には、父親の率いるゴーストルールが待ち構えている。' }
        ]
      },
      S5: {
        title: '船着き場、ゴーストルールの面々',
        lines: [
          { chapter:'1. 桟橋の先', speaker:'', text:'最後の坂を下りきると、潮風が一層強くなる。波が白く砕ける桟橋の先に、黒い船体に赤い紋が浮かぶ大型船が停泊している。甲板には五つの人影が並び、こちらを待っていた。' },
          { chapter:'1. 桟橋の先', speaker:'リオーネ', text:'……あそこだ。一番前に立っているのが、父——シープ・シーマン。それに並んでいるのが幹部たち。' },
          { chapter:'1. 桟橋の先', speaker:'クレイン', text:'俺たちがついている。大丈夫だ。' },
          { chapter:'1. 桟橋の先', speaker:'リーナ', text:'一人じゃないですよ。' },
          { chapter:'1. 桟橋の先', speaker:'リオーネ', text:'だ、当たり前でしょ！ 私が案内してるんだから、私がちゃんとするに決まってる！ ……ついて来なさい。' },
          { chapter:'2. 幹部たちの出迎え', speaker:'ガリザー・アメリー', text:'やあやあ、お待ちしてたぜ！ ……って、あれ？ リオーネじゃん！ なんで知らない奴ら連れて帰ってきてんの？ ま、いいや——用事済ませたらさっさとこいつらをたたっ斬ればいいんだろ？' },
          { chapter:'2. 幹部たちの出迎え', speaker:'ラーコウ', text:'ガリザー、騒ぐな。相手が来たんだ。まずは話を聞いてからでも遅くない。……久しぶりだね、リオーネ。' },
          { chapter:'2. 幹部たちの出迎え', speaker:'リオーネ', text:'……うん。' },
          { chapter:'2. 幹部たちの出迎え', speaker:'パンデ・二イカ', text:'……なるほど。噂の娘さんだね。繊細で、白くて……本当に美しい。あんたはどいつだ。男には用はない。どっかに退いてくれないか。' },
          { chapter:'2. 幹部たちの出迎え', speaker:'サハーダ', text:'お前が連れてきたのか。その娘を、自分の身を挺して守るってわけだ。悪くない。……嫌いじゃないぜ、そういうの。' },
          { chapter:'3. 団長 シープ・シーマン', speaker:'シープ・シーマン', text:'戻ったか。……随分時間がかかったな。余計なことをしていないだろうな。' },
          { chapter:'3. 団長 シープ・シーマン', speaker:'リオーネ', text:'余計なことって何よ。父さんがしようとしてることの方が、余計なの！ リーナを攫って、核の欠片を力ずくで奪うなんて——間違ってる！' },
          { chapter:'3. 団長 シープ・シーマン', speaker:'シープ・シーマン', text:'間違いだと？ 何も知らないくせに。核の欠片を手に入れた者が、この世界の頂点に立つ。それが真実だ。お前はただ、言われた通りにその娘を連れてくればよかったんだ。' },
          { chapter:'3. 団長 シープ・シーマン', speaker:'リオーネ', text:'私のことなんて、どうでもいいの？ 小さい頃からそうだった。父さんはいつも「欠片」の話ばかりで、私の話なんて一度も聞いてくれなかった。私が逃げようとしたら……短刀を突きつけてまで止めたじゃない。それが「親」のすることなの？' },
          { chapter:'3. 団長 シープ・シーマン', speaker:'シープ・シーマン', text:'俺のやり方に口を出すな。育ててやっただけでもありがたいと思え。お前は俺のものだ。逃げることなんて許さない。' },
          { chapter:'4. それぞれの立場', speaker:'ガリザー・アメリー', text:'団長、そろそろ始めようぜ！ 邪魔な奴らはさっさとたたっ斬って、娘さんを船に乗せちまえば話は終わりだ！' },
          { chapter:'4. それぞれの立場', speaker:'パンデ・二イカ', text:'本当に美しい……。傷一つつけないで、優しく扱ってあげないとね。君は本当にどいてくれ。男と戦うほど、俺は暇じゃないんだ。' },
          { chapter:'4. それぞれの立場', speaker:'サハーダ', text:'だが団長、こいつらも簡単には引かないだろうよ。——おい、クレイン。その娘を守り抜いてみろよ。それができる男か、俺に見せてくれ。悪いが、手加減はしないぜ。' },
          { chapter:'4. それぞれの立場', speaker:'ラーコウ', text:'……仕方ない。俺たちは団長に従う。だが、血みどろになる前に、話し合いで済むならそれに越したことはない。' },
          { chapter:'4. それぞれの立場', speaker:'シープ・シーマン', text:'話し合いなど無意味だ。リーナをこちらに渡せ。さもなければ——この場でたたき伏せる。リオーネ、お前も目を覚ませ。俺の言うことを聞いていれば、悪いようにはしない。' },
          { chapter:'4. それぞれの立場', speaker:'リオーネ', text:'悪いようにはしない……？ それが一番怖いことだと、私は知ってる。私はもう、父さんの言いなりにならない。' },
          { chapter:'4. それぞれの立場', speaker:'クレイン', text:'リーナは渡さない。リオーネも、自分の心に従っていい。お前のやり方は、力で奪うだけだ。それが「頂点」だなんて、誰が認めるものか。' },
          { chapter:'4. それぞれの立場', speaker:'', text:'潮風が船の旗をはためかせる。桟橋の上で両者の気配が張り詰める。ガリザーの鋏、サハーダの大剣、パンデの妖しい笑み、ラーコウの盾、そしてシーマンの短刀。リオーネの虹色の光が、三人を守るように強く輝き始める。' },
          { chapter:'4. それぞれの立場', speaker:'クレイン', text:'行くぞ。俺たちの手で、間違いを正す。' },
          { chapter:'4. それぞれの立場', speaker:'', text:'こうして、ゴーストルールとの戦いが始まる。海に映る空は、重たく暗く垂れ込めていた。—— S5 了 ——' }
        ]
      }
    };
    const event = events[eventId];
    const chapterEl = document.getElementById('chapter');
    const speakerEl = document.getElementById('speaker');
    const textEl = document.getElementById('text');
    const progressEl = document.getElementById('progress');
    const nextButton = document.getElementById('next');
    const sceneLayout = document.getElementById('sceneLayout');
    const portraitEl = document.getElementById('portrait');
    const characterPortraits = {
      'クレイン': { src: 'assets/character_assets/クレイン_再生成版-removebg.png', side: 'right' },
      'リーナ': { src: 'assets/character_assets/リーナ_再生成版-removebg.png', side: 'left' },
      'ガルド': { src: 'assets/character_assets/ガルド-removebg.png', side: 'left' },
      'ロードマン': { src: 'assets/character_assets/盗賊団ロキ/盗賊_ロードマン-removebg-preview.png', side: 'left' },
      'ローザ': { src: 'assets/character_assets/盗賊団ロキ/盗賊_ローザ-removebg-preview.png', side: 'left' },
      'ローラ': { src: 'assets/character_assets/盗賊団ロキ/盗賊_ローラ-removebg-preview.png', side: 'left' },
      'ギル・マッシュ': { src: 'assets/character_assets/盗賊団ロキ/盗賊_ギル_マッシュ-removebg-preview.png', side: 'left' },
      'リオーネ': { src: 'assets/character_assets/海賊団ゴーストルール/リオーネ-removebg-preview.png', side: 'left' },
      'ガリザー・アメリー': { src: 'assets/character_assets/海賊団ゴーストルール/海賊_ガリザー_アメリー-removebg-preview.png', side: 'left' },
      'ラーコウ': { src: 'assets/character_assets/海賊団ゴーストルール/海賊_ラーコウ-removebg-preview.png', side: 'left' },
      'パンデ・二イカ': { src: 'assets/character_assets/海賊団ゴーストルール/海賊_パンデ_二イカ-removebg-preview.png', side: 'left' },
      'サハーダ': { src: 'assets/character_assets/海賊団ゴーストルール/海賊_サハーダ-removebg-preview.png', side: 'left' },
      'シープ・シーマン': { src: 'assets/character_assets/海賊団ゴーストルール/船長シープ_シーマン-removebg-preview.png', side: 'left' }
    };
    let index = 0;

    function finishEvent() {
      try {
        const raw = sessionStorage.getItem('voidMasterStoryHandoff');
        if (raw) {
          const handoff = JSON.parse(raw);
          if (handoff && handoff.state) {
            const state = handoff.state;
            if (!Array.isArray(state.storyEventsCompleted)) state.storyEventsCompleted = [];
            if (!state.storyEventsCompleted.includes(eventId)) state.storyEventsCompleted.push(eventId);
            if (eventId === 'S2') state.coreFragmentObtained = true;
            if (eventId === 'S3') state.assistantPhase1Unlocked = true;
            if (eventId === 'S4') state.rioneJoined = true;
            sessionStorage.setItem('voidMasterStoryHandoff', JSON.stringify({ state }));
          }
        }
      } catch (error) {
        console.error('Story completion handoff failed:', error);
      }
      location.href = 'game.html';
    }

    function renderLine() {
      const line = event.lines[index];
      chapterEl.textContent = line.chapter;
      speakerEl.textContent = line.speaker;
      textEl.textContent = line.text;
      const character = characterPortraits[line.speaker];
      sceneLayout.classList.remove('crane-speaker', 'other-speaker', 'narration');
      if (character) {
        portraitEl.src = character.src;
        portraitEl.alt = line.speaker;
        portraitEl.hidden = false;
        sceneLayout.classList.add(character.side === 'right' ? 'crane-speaker' : 'other-speaker');
        if (character.side === 'right') sceneLayout.appendChild(portraitEl);
        else sceneLayout.insertBefore(portraitEl, sceneLayout.firstElementChild);
      } else {
        portraitEl.hidden = true;
        portraitEl.removeAttribute('src');
        portraitEl.alt = '';
        sceneLayout.classList.add('narration');
      }
      progressEl.textContent = (index + 1) + ' / ' + event.lines.length;
      nextButton.textContent = index === event.lines.length - 1 ? '探索に戻る ▶' : '次へ ▶';
    }

    if (!event) {
      document.getElementById('title').textContent = '不明なストーリーイベント';
      chapterEl.textContent = 'ERROR';
      textEl.textContent = 'イベントID「' + eventId + '」は登録されていない。';
      progressEl.textContent = '';
      nextButton.textContent = 'ゲームに戻る';
      nextButton.addEventListener('click', () => { location.href = 'game.html'; });
    } else {
      document.getElementById('title').textContent = event.title;
      nextButton.addEventListener('click', () => {
        if (index < event.lines.length - 1) {
          index += 1;
          renderLine();
        } else {
          finishEvent();
        }
      });
      renderLine();
    }
  </script>
</body>
</html>
