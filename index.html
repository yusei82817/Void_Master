<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Void Master - Loading</title>
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: sans-serif;
    }

    .loading-panel {
      box-sizing: border-box;
      width: min(82vw, 520px);
      min-height: 112px;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-radius: 14px;
      text-align: center;
    }

    #loading-message {
      margin: 0;
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 600;
      opacity: 1;
      transition: opacity 250ms ease;
    }

    #loading-message.is-changing {
      opacity: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-message {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="loading-panel" aria-live="polite" aria-atomic="true">
    <h2 id="loading-message">Now Loading...</h2>
  </main>

  <script>
    const messages = [
      "Now Loading...",
      "Preparing the world...",
      "Please wait...",
      "Almost there...",
      "私はあなたを見ている",
      "画面を覗く。すると画面もあなたを覗いているのだ。",
      "深淵と楽園が同時に存在する場所。それが音の神域なのだ。",
      "音神のリュコス",
      "彼女の寝室はピアノの弦の上なんだとか。",
      "クレイン",
      "彼は過去に親から捨てられていたんだとか。",
      "彼はそのたびに家に戻ってきて、",
      "そのたびに追い出されていた。",
      "Hello, my name is Nio",
      "I used Github",
      "This is New Project",
      "I like Programming",
      "Because Programming is Fun!",
      "I cannot speak English",
      "but, I can write English",
    ];

    const messageElement = document.getElementById("loading-message");
    let messageIndex = 0;

    window.setInterval(() => {
      messageElement.classList.add("is-changing");

      window.setTimeout(() => {
        messageIndex = (messageIndex + 1) % messages.length;
        messageElement.textContent = messages[messageIndex];
        messageElement.classList.remove("is-changing");
      }, 250);
    }, 3000);
  </script>
</body>
</html>
