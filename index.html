<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030408">
  <title>Void Master</title>
  <style>
    :root {
      color-scheme: dark;
      --white: #f2f4f8;
      --muted: #9ba3b5;
      --blue: #8da9ff;
      --panel: rgba(5, 7, 13, 0.78);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #030408;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--white);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(31, 42, 68, 0.19), transparent 48%),
        linear-gradient(180deg, #030408 0%, #070a12 58%, #020306 100%);
    }

    .scene::before,
    .scene::after {
      position: absolute;
      z-index: -1;
      content: "";
      pointer-events: none;
      transition: opacity 1.8s ease, transform 2.5s ease;
    }

    .scene::before {
      inset: -20%;
      opacity: 0;
      background:
        radial-gradient(ellipse at 50% 56%, rgba(65, 97, 165, 0.2), transparent 35%),
        radial-gradient(ellipse at 50% 100%, rgba(25, 38, 67, 0.28), transparent 45%);
      transform: scale(1.08);
    }

    .scene::after {
      inset: 0;
      opacity: 0.18;
      background-image: radial-gradient(rgba(190, 205, 239, 0.65) 0.6px, transparent 0.8px);
      background-size: 43px 43px;
      mask-image: linear-gradient(transparent, #000 35%, #000 75%, transparent);
    }

    .scene.has-light::before { opacity: 1; transform: scale(1); }
    .scene.has-light::after { opacity: 0.3; }

    .loading-screen {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: #030408;
      opacity: 1;
      transition: opacity 850ms ease, visibility 850ms ease;
    }

    .loading-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-panel {
      display: grid;
      justify-items: center;
      gap: 22px;
      width: min(82vw, 480px);
      padding: 34px 26px;
      border: 1px solid rgba(235, 240, 255, 0.72);
      border-radius: 12px;
      text-align: center;
    }

    .logo {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 400;
      letter-spacing: 0.22em;
    }

    .loading-caption {
      margin: 0;
      color: #c5c9d4;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
    }

    .loading-track {
      width: min(100%, 250px);
      height: 2px;
      overflow: hidden;
      background: rgba(255,255,255,0.14);
    }

    .loading-progress {
      width: 100%;
      height: 100%;
      background: #dce4ff;
      transform: scaleX(0);
      transform-origin: left;
      animation: load 1.5s ease-in-out forwards;
    }

    @keyframes load {
      to { transform: scaleX(1); }
    }

    .opening {
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(900px, 100%);
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(24px, 5vh, 54px) clamp(22px, 7vw, 82px) clamp(20px, 4vh, 42px);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    .opening.is-visible { opacity: 1; transform: translateY(0); }

    .opening-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
    }

    .chapter-mark { white-space: nowrap; }

    .story-area {
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 34px 0;
      cursor: pointer;
      outline: none;
    }

    .story-area:focus-visible {
      outline: 1px solid rgba(141, 169, 255, 0.65);
      outline-offset: 8px;
    }

    .eyebrow {
      margin: 0 0 clamp(26px, 5vh, 46px);
      color: var(--blue);
      font-size: 0.7rem;
      letter-spacing: 0.32em;
      opacity: 0.9;
    }

    .story-text {
      width: 100%;
      max-width: 680px;
      min-height: 7.5em;
      margin: 0;
      color: #f0f1f6;
      font-size: clamp(1.05rem, 2.5vw, 1.42rem);
      font-weight: 400;
      line-height: 2.25;
      letter-spacing: 0.055em;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-shadow: 0 2px 18px rgba(0,0,0,0.45);
    }

    .story-text.is-fading { opacity: 0; }
    .story-text { transition: opacity 220ms ease; }

    .cursor {
      display: inline-block;
      width: 1px;
      height: 1.1em;
      margin-left: 3px;
      vertical-align: -0.16em;
      background: var(--blue);
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink { to { visibility: hidden; } }

    .opening-footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
    }

    .progress-label { font-variant-numeric: tabular-nums; }

    .progress-track {
      width: min(25vw, 180px);
      height: 1px;
      background: rgba(255,255,255,0.18);
    }

    .progress-value {
      width: 0;
      height: 100%;
      background: var(--blue);
      transition: width 300ms ease;
    }

    .control-hint { text-align: right; }

    .text-button {
      padding: 8px 0;
      border: 0;
      background: transparent;
      color: #c3c8d6;
      cursor: pointer;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      transition: color 180ms ease;
    }

    .text-button:hover { color: #fff; }
    .text-button:focus-visible { outline: 1px solid var(--blue); outline-offset: 5px; }

    .title-call {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      background: #020307;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.1s ease, visibility 1.1s ease;
    }

    .title-call::before {
      position: absolute;
      inset: -25%;
      content: "";
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at center, rgba(94, 125, 206, 0.25), transparent 35%);
      transform: scale(0.7);
      transition: opacity 1.8s ease, transform 2.8s ease;
    }

    .title-call.is-visible { opacity: 1; visibility: visible; }
    .title-call.is-visible::before { opacity: 1; transform: scale(1.15); }

    .title-call-content {
      position: relative;
      text-align: center;
      transform: translateY(12px);
      opacity: 0;
      transition: opacity 1.4s ease 0.55s, transform 1.4s ease 0.55s;
    }

    .title-call.is-visible .title-call-content { opacity: 1; transform: translateY(0); }

    .title-call-kicker {
      margin: 0 0 26px;
      color: #aabbe9;
      font-size: 0.66rem;
      letter-spacing: 0.48em;
    }

    .title-call-logo {
      margin: 0;
      padding-left: 0.2em;
      color: #f5f6fb;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 8vw, 5.4rem);
      font-weight: 400;
      letter-spacing: 0.2em;
      text-shadow: 0 0 35px rgba(147, 174, 255, 0.28);
    }

    .title-call-rule {
      width: min(58vw, 250px);
      height: 1px;
      margin: 28px auto 22px;
      background: linear-gradient(90deg, transparent, rgba(202, 215, 255, 0.85), transparent);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 1.2s ease 1s;
    }

    .title-call.is-visible .title-call-rule { transform: scaleX(1); }

    .title-call-subtitle {
      margin: 0;
      color: #b8bfd1;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
    }

    .title-call-continue {
      display: inline-block;
      margin-top: 58px;
      opacity: 0;
      animation: none;
    }

    .title-call.is-ready .title-call-continue {
      animation: appear 900ms ease forwards;
    }

    @keyframes appear { to { opacity: 1; } }

    .end-screen {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(2, 3, 7, 0.88);
      opacity: 0;
      visibility: hidden;
      transition: opacity 700ms ease, visibility 700ms ease;
    }

    .end-screen.is-visible { opacity: 1; visibility: visible; }

    .end-content { text-align: center; }
    .end-content h2 {
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 0.18em;
    }
    .end-content p { color: var(--muted); font-size: 0.88rem; letter-spacing: 0.12em; }
    .title-menu { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 22px; margin-top: 28px; }
    .game-start-link { color: #dce4ff; text-decoration: none; border-bottom: 1px solid rgba(141, 169, 255, .55); }
    .game-start-link:hover { color: #fff; border-bottom-color: #fff; }

    @media (max-width: 560px) {
      .opening { padding-inline: 22px; }
      .opening-header { font-size: 0.62rem; letter-spacing: 0.14em; }
      .story-text { min-height: 9em; line-height: 2.05; }
      .opening-footer { grid-template-columns: auto 1fr auto; gap: 12px; }
      .progress-track { width: 100%; }
      .control-hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <section class="loading-screen" id="loading-screen" aria-label="Loading">
      <div class="loading-panel">
        <h1 class="logo">VOID MASTER</h1>
        <p class="loading-caption">世界を読み込んでいます...</p>
        <div class="loading-track" aria-hidden="true"><div class="loading-progress"></div></div>
      </div>
    </section>

    <section class="opening" id="opening" aria-label="オープニング">
      <header class="opening-header">
        <span>VOID MASTER</span>
        <span class="chapter-mark">PROLOGUE · 00</span>
      </header>

      <div class="story-area" id="story-area" role="button" tabindex="0" aria-label="クリックまたはEnterで次へ進む">
        <p class="eyebrow">RINA'S MONOLOGUE</p>
        <p class="story-text" id="story-text" aria-live="polite" aria-atomic="true"></p>
      </div>

      <footer class="opening-footer">
        <span class="progress-label" id="progress-label">01 / 40</span>
        <div class="progress-track" aria-hidden="true"><div class="progress-value" id="progress-value"></div></div>
        <button class="text-button" id="skip-button" type="button">SKIP ↗</button>
      </footer>
    </section>

    <section class="title-call" id="title-call" aria-label="タイトルコール" aria-hidden="true">
      <div class="title-call-content">
        <p class="title-call-kicker">THE WORLD IS NOT YET LOST</p>
        <h2 class="title-call-logo">VOID MASTER</h2>
        <div class="title-call-rule" aria-hidden="true"></div>
        <p class="title-call-subtitle">闇が濃くなるほど、光は際立つ。</p>
        <button class="text-button title-call-continue" id="title-continue" type="button">CONTINUE ↗</button>
      </div>
    </section>

    <section class="end-screen" id="end-screen" aria-hidden="true">
      <div class="end-content">
        <h2>VOID MASTER</h2>
        <p>—— 物語は、ここから始まる。</p>
        <p class="title-menu">
          <a class="text-button game-start-link" href="game.html">本編を始める ↗</a>
          <button class="text-button" id="replay-button" type="button">オープニングをもう一度見る ↺</button>
        </p>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const monologue = [
      "私は……何も知らない。",
      "自分がどこから来たのか、なぜここにいるのか ——",
      "名前以外は、何も。",
      "目が覚めた時、周りは黒に包まれていた。",
      "大地は濁り、空は澱み、音さえも吸い込まれていく場所。",
      "それが「クローロ」だと、後になって知った。",
      "なのに私は ——",
      "その闇の中に立っても、少しも痛くなかった。",
      "傷もつかなければ、苦しくもない。",
      "周りのものが次々と呑まれていく中で、私だけが、ただ佇んでいた。",
      "「なぜ君は平気なの？」",
      "誰かがそう言った。",
      "「なぜ闇に消されないの？」",
      "その問いに、私は答えられない。",
      "…… 私自身が、何なのか分からないから。",
      "教えてほしい。",
      "私は誰なの？",
      "何のために在るの？",
      "この白い髪も、蒼い瞳も ——",
      "そして、胸の奥で疼くこの光は、いったい何なの？",
      "「核の欠片」だなんて、そんな言葉で括られるのは苦しい。",
      "道具じゃない。",
      "生贄にされるためだけに生まれてきたんじゃない。",
      "ただ……",
      "誰かの手を、握りたいだけなのに。",
      "共に歩いて、同じものを見て、笑い合いたいだけなのに。",
      "クローロは何もかもを飲み込もうとしている。",
      "でも ——",
      "闇が濃くなるほど、光は際立つ。",
      "私の中のこの光は、きっと消えない。",
      "あなたはそこにいてくれますか？",
      "私の手を取ってくれますか？",
      "闇が怖いと、同じように思ってくれますか？",
      "—— クレイン。",
      "初めて名前を呼んだ人。",
      "あなたがそばにいてくれるのなら、私は闇の中でも歩いていける。",
      "二人なら、きっと ——",
      "この世界の空白を、埋めることができる。",
      "私は消えたりしない。",
      "あなたと共に、生きるから。"
    ];

    const loadingScreen = document.getElementById("loading-screen");
    const opening = document.getElementById("opening");
    const scene = document.getElementById("scene");
    const storyArea = document.getElementById("story-area");
    const storyText = document.getElementById("story-text");
    const progressLabel = document.getElementById("progress-label");
    const progressValue = document.getElementById("progress-value");
    const skipButton = document.getElementById("skip-button");
    const titleCall = document.getElementById("title-call");
    const titleContinue = document.getElementById("title-continue");
    const endScreen = document.getElementById("end-screen");
    const replayButton = document.getElementById("replay-button");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    let lineIndex = 0;
    let characterIndex = 0;
    let typingTimer = null;
    let isTyping = false;
    let isEnded = false;
    let titleTimer = null;

    function updateProgress() {
      progressLabel.textContent =
        String(Math.min(lineIndex + 1, monologue.length)).padStart(2, "0") +
        " / " + String(monologue.length).padStart(2, "0");
      progressValue.style.width = (lineIndex / monologue.length * 100) + "%";
    }

    function stopTyping() {
      if (typingTimer !== null) {
        window.clearTimeout(typingTimer);
        typingTimer = null;
      }
    }

    function finishCurrentLine() {
      stopTyping();
      storyText.textContent = monologue[lineIndex];
      characterIndex = monologue[lineIndex].length;
      isTyping = false;
    }

    function typeNextCharacter() {
      if (!isTyping) return;

      const line = monologue[lineIndex];
      if (characterIndex >= line.length) {
        isTyping = false;
        typingTimer = null;
        return;
      }

      characterIndex += 1;
      storyText.textContent = line.slice(0, characterIndex);
      const char = line[characterIndex - 1];
      const pause = "、。？！……".includes(char) ? 210 : 42;
      typingTimer = window.setTimeout(typeNextCharacter, reduceMotion.matches ? 0 : pause);
    }

    function showLine(index) {
      stopTyping();
      lineIndex = index;
      characterIndex = 0;
      isTyping = true;
      storyText.classList.add("is-fading");

      window.setTimeout(() => {
        storyText.textContent = "";
        storyText.classList.remove("is-fading");
        updateProgress();
        if (lineIndex >= 28) scene.classList.add("has-light");
        else scene.classList.remove("has-light");
        if (reduceMotion.matches) {
          finishCurrentLine();
          return;
        }
        typeNextCharacter();
      }, reduceMotion.matches ? 0 : 180);
    }

    function nextLine() {
      if (isEnded) return;
      if (isTyping) {
        finishCurrentLine();
        return;
      }
      if (lineIndex < monologue.length - 1) {
        showLine(lineIndex + 1);
      } else {
        finishOpening();
      }
    }

    function finishOpening() {
      stopTyping();
      isTyping = false;
      isEnded = true;
      if (titleTimer !== null) window.clearTimeout(titleTimer);
      opening.classList.remove("is-visible");
      scene.classList.add("has-light");
      titleCall.classList.add("is-visible");
      titleCall.setAttribute("aria-hidden", "false");
      titleCall.classList.remove("is-ready");
      titleTimer = window.setTimeout(() => {
        titleCall.classList.add("is-ready");
      }, reduceMotion.matches ? 0 : 2200);
    }

    function leaveTitleCall() {
      if (!titleCall.classList.contains("is-visible")) return;
      titleCall.classList.remove("is-visible", "is-ready");
      titleCall.setAttribute("aria-hidden", "true");
      endScreen.classList.add("is-visible");
      endScreen.setAttribute("aria-hidden", "false");
    }

    function startOpening() {
      stopTyping();
      if (titleTimer !== null) window.clearTimeout(titleTimer);
      lineIndex = 0;
      isEnded = false;
      titleCall.classList.remove("is-visible", "is-ready");
      titleCall.setAttribute("aria-hidden", "true");
      endScreen.classList.remove("is-visible");
      endScreen.setAttribute("aria-hidden", "true");
      opening.classList.add("is-visible");
      skipButton.textContent = "SKIP ↗";
      scene.classList.remove("has-light");
      showLine(0);
    }

    function skipOpening() {
      if (isEnded) return;
      finishCurrentLine();
      finishOpening();
    }

    storyArea.addEventListener("click", nextLine);
    storyArea.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        nextLine();
      }
    });

    skipButton.addEventListener("click", (event) => {
      event.stopPropagation();
      skipOpening();
    });

    titleContinue.addEventListener("click", leaveTitleCall);
    replayButton.addEventListener("click", startOpening);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !isEnded) skipOpening();
      if ((event.key === "Enter" || event.key === " ") &&
          titleCall.classList.contains("is-visible") &&
          event.target !== titleContinue) {
        event.preventDefault();
        leaveTitleCall();
        return;
      }
      if ((event.key === "Enter" || event.key === " ") &&
          event.target !== storyArea &&
          event.target !== skipButton &&
          event.target !== replayButton &&
          event.target !== titleContinue &&
          !isEnded) {
        event.preventDefault();
        nextLine();
      }
    });

    window.setTimeout(() => {
      loadingScreen.classList.add("is-hidden");
      opening.classList.add("is-visible");
      window.setTimeout(startOpening, reduceMotion.matches ? 0 : 550);
    }, 1650);
  </script>
</body>
</html>
